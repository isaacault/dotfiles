# true color
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -s escape-time 0
set -g focus-events on

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded tmux.conf"

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g history-limit 50000
set -g mouse on
set -g display-time 2000
set -g status-interval 5
setw -g aggressive-resize on
# closing the last window of a session switches to another session, not out of tmux
set -g detach-on-destroy off

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi 'C-v' send-keys -X rectangle-selection
if-shell 'test "$(uname)" = Darwin' \
  "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'" \
  "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'"

# copies also reach the local clipboard through the terminal (OSC 52), which
# works over SSH where xclip has no display; alacritty must be told it supports it
set -s set-clipboard on
set -as terminal-features ',alacritty*:clipboard'

# open new panes/windows in the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

bind -r m resize-pane -Z

# Claude CLI Settings
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# list of tmux plugins
set -g @plugin 'catppuccin/tmux#v2.3.0' # pinned to match scripts/fetch-plugins.sh; bump both together

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

set -g @catppuccin_flavor 'mocha' # latte,frappe, macchiato or mocha
set -g @catppuccin_window_status_style "custom"
# window number as a pill: rounded left cap (drawn in the number colour, then the
# number style restored, as #[none] would drop it), rounded right cap into the
# name, and the name rounded off at its far end
set -g @catppuccin_window_left_separator "#[fg=#{@catppuccin_window_number_color},bg=#{@_ctp_status_bg}]\ue0b6#[fg=#{@thm_crust},bg=#{@catppuccin_window_number_color}]"
set -g @catppuccin_window_middle_separator "#[fg=#{@catppuccin_window_number_color},bg=#{@catppuccin_window_text_color}]\ue0b4"
set -g @catppuccin_window_right_separator " #[fg=#{@catppuccin_window_text_color},bg=#{@_ctp_status_bg}]\ue0b4#[none] "
set -g @catppuccin_window_current_left_separator "#[fg=#{@catppuccin_window_current_number_color},bg=#{@_ctp_status_bg}]\ue0b6#[fg=#{@thm_crust},bg=#{@catppuccin_window_current_number_color}]"
set -g @catppuccin_window_current_middle_separator "#[fg=#{@catppuccin_window_current_number_color},bg=#{@catppuccin_window_current_text_color}]\ue0b4"
set -g @catppuccin_window_current_right_separator " #[fg=#{@catppuccin_window_current_text_color},bg=#{@_ctp_status_bg}]\ue0b4#[none] "
set -g @catppuccin_window_text " #{b:pane_current_path}#{?window_zoomed_flag, \U000f004c,}" # icon while zoomed (prefix m)
set -g @catppuccin_window_current_text " #{b:pane_current_path}#{?window_zoomed_flag, \U000f004c,}"
# round the far end of status modules (session) too; the module only sets the
# separator's fg, so give it the bar background or it vanishes into the module
set -g @catppuccin_status_right_separator "#[bg=#{@_ctp_status_bg}]\ue0b4"
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager
run '~/.config/tmux/plugins/tpm/tpm'

# catppuccin v2 modules only exist once the plugin has loaded, so build the status line after tpm
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session}"
