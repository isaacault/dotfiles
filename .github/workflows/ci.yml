name: ci
on:
  push:
  pull_request:

jobs:
  fresh-link:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stow
        run: |
          if [ "$(uname)" = "Darwin" ]; then brew install stow; else sudo apt-get update -qq && sudo apt-get install -y -qq stow; fi
      - name: Smoke test
        # links into scratch $HOMEs (core+gui, core only, work overlay fixture)
        run: bash test/local-test.sh
      - name: Assert no secrets in tracked files
        run: |
          ! git ls-files -z | xargs -0 grep -lE "(nvapi-|glpat-|ghp_)" 2>/dev/null | grep -q .

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh scripts/*.sh test/*.sh
